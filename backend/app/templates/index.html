{% extends "base.html" %}
{% block content %}
  <section id="reviews" class="grid">
    <!-- Review Submission Form -->
    <form action="/submit_review" method="POST">
      <label for="title">Review Title:</label>
      <input type="text" id="title" name="title" required><br>

      <label for="artist">Artist:</label>
      <input type="text" id="artist" name="artist" required><br>

      <label for="rating">Rating (1-10):</label>
      <input type="number" id="rating" name="rating" min="1" max="10" required><br>

      <label for="review">Your Review:</label><br>
      <textarea id="review" name="review" rows="5" cols="40" required></textarea><br>

      <button type="submit">Submit Review</button>
    </form>

    <!-- List of Reviews -->
    <h2>Latest Reviews</h2>
    <ul>
      {% for review in reviews %}
        <li>
          <a href="{{ url_for('public.review_detail', review_id=review.id) }}">
            <strong>{{ review.artist }}</strong> - {{ review.album }} ({{ review.rating }}/10)
          </a>
        </li>
      {% else %}
        <li>No reviews yet.</li>
      {% endfor %}
    </ul>
  </section>
{% endblock %}
